<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nutrition Chatbot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow-lg p-4 animate-fade-in">
      <h3 class="text-center mb-4">🥗 Nutrition Chatbot</h3>
      <form method="post" action="/chat">
        <div class="mb-3">
          <input type="text" name="message" class="form-control form-control-lg" placeholder="Ask about your diet..." required>
        </div>
        <div class="text-center">
          <button class="btn btn-success btn-lg px-5">Send</button>
        </div>
      </form>

      {% if message %}
      <div class="mt-4">
        <strong>You:</strong>
        <p class="user-message">{{ message }}</p>
        <div class="typing-indicator mt-2">🧠 Nutrition Bot is typing...</div>
      </div>
      {% endif %}

      {% if response %}
      <div class="mt-3">
        <strong>Bot:</strong>
        <p class="bot-response animate-slide-up">{{ response }}</p>
      </div>
      {% endif %}
    </div>
  </div>
</body>
</html>
